<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Admin sign in — LUMEN</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body data-page="login" class="admin-body">
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" tabindex="-1" class="admin-login">
    <p class="eyebrow">LUMEN admin</p>
    <h1>Sign in</h1>
    <p class="form-note">Private area for approved administrators. Public registration is not available.</p>
    <form id="login-form" class="contact-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" maxlength="254" aria-describedby="email-error" />
        <span class="field-error" id="email-error">Enter your email address.</span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="256" aria-describedby="password-error" />
        <span class="field-error" id="password-error">Enter your password.</span>
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
    <noscript><p class="noscript-note">JavaScript is required to sign in.</p></noscript>
  </main>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
